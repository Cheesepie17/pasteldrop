<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Soft Pastel Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Full Bleed Rounded Square -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Concentric Minimal Ripple Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.4" />

  <!-- Modern Geometric Paper Plane / Drop Glyph -->
  <g filter="url(#softGlow)">
    <!-- Main wing -->
    <path d="M120 240 L380 140 L280 380 L228 284 Z" fill="url(#planeGrad)" />
    <!-- Fold wing -->
    <path d="M380 140 L228 284 L220 372 L260 316 Z" fill="url(#accentGrad)" opacity="0.85" />
    <!-- Sleek fold line -->
    <path d="M380 140 L228 284" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Little Sparkle / Drop Dot -->
  <circle cx="396" cy="120" r="10" fill="#38bdf8" opacity="0.9" />
  <circle cx="120" cy="380" r="8" fill="#818cf8" opacity="0.6" />
</svg>
